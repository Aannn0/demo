# 应用名字叫 demo
spring.application.name=demo

# 服务端口 8080（浏览器/Postman 通过 localhost:8080 访问）
server.port=8080

# 数据库连接地址：本机 3307 端口的 java_demo 数据库（java_demo 是"数据库名/库名"，不是文件名）
spring.datasource.url=jdbc:mysql://localhost:3307/java_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai

# 数据库账号名
spring.datasource.username=root

# 数据库账号密码
spring.datasource.password=@Root0774

# MySQL 驱动类
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 把数据库的下划线字段和 Java 驼峰属性自动对应，让其能识别驼峰
mybatis-plus.configuration.map-underscore-to-camel-case=true
